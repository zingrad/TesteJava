server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Os assets com hash no nome nunca mudam de conteudo, entao podem ser cacheados sem medo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A SPA resolve as rotas no cliente: qualquer caminho desconhecido devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
