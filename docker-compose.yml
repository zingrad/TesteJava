services:
  db:
    image: postgres:16-alpine
    container_name: srm-db
    environment:
      POSTGRES_DB: srm_credit
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
    ports:
      - "5432:5432"
    volumes:
      - srm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm_credit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: srm-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/srm_credit
      DB_USER: srm
      DB_PASSWORD: srm
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  srm-db-data:
